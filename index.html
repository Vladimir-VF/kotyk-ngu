<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}

<title>Який ти котик НГУ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: тканина ріпстоп; 2 етапи місій (напрям, посада); результат як особова справа з вишитим шевроном; моральна панель на 25 шевронів */
:root {
  color-scheme: dark;
  --bg: #10140d;
  --tape: #232b1b;
  --tape-hi: #2c3622;
  --thread: #4a5634;
  --fg: #efebd9;
  --muted: #a7ab92;
  --gold: #dcae3f;
  --gold-deep: #a9801f;
  --red: #b8322a;
  --paper: #d9c69c;
  --paper-ink: #2a2216;
  --paper-line: #b39c6c;
  --font-display: "Dela Gothic One", "Arial Black", Impact, system-ui, sans-serif;
  --font-body: "Golos Text", "Segoe UI", system-ui, sans-serif;
  --font-type: "PT Mono", "Courier New", ui-monospace, monospace;
  --glow: rgba(220,174,63,.13);
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background-color: var(--bg);
  background-image:
    radial-gradient(1000px 560px at 85% -12%, var(--glow), transparent 62%),
    radial-gradient(800px 600px at -15% 105%, rgba(74,86,52,.45), transparent 62%);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  overflow-x: hidden;
}
.wrap {
  max-width: 620px; margin: 0 auto;
  padding-block: 18px 44px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 22px;
}
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-family: var(--font-type); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.topbar b { color: var(--gold); font-weight: 400; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; margin: 0; line-height: 1.02; text-wrap: balance; }
p { margin: 0; }
.eyebrow { font-family: var(--font-type); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); }
#app { display: flex; flex-direction: column; gap: 22px; }

/* кнопки */
.btn {
  appearance: none; border: 0; cursor: pointer; text-decoration: none;
  display: inline-flex; justify-content: center; align-items: center; gap: 10px;
  font-family: var(--font-display); font-size: 18px; letter-spacing: .02em;
  color: #1c1505; background: var(--gold);
  padding: 18px 24px; border-radius: 14px;
  box-shadow: 0 4px 0 var(--gold-deep), 0 10px 24px rgba(0,0,0,.35);
  transition: transform .12s ease, box-shadow .12s ease, filter .12s ease;
  position: relative;
}
.btn::after { content: ""; position: absolute; inset: 5px; border: 1.5px dashed rgba(28,21,5,.35); border-radius: 10px; pointer-events: none; }
.btn:hover { filter: brightness(1.06); }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--gold-deep), 0 4px 10px rgba(0,0,0,.35); }
.btn.alt { background: var(--tape-hi); color: var(--fg); box-shadow: 0 4px 0 #11160d, 0 10px 24px rgba(0,0,0,.3); font-size: 15px; padding: 15px 18px; }
.btn.alt::after { border-color: rgba(239,235,217,.22); }
.btn:focus-visible, .tape:focus-visible, .link-btn:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }

/* старт */
.crest { display: flex; align-items: center; gap: 14px; }
.crest img { width: 64px; height: auto; flex: 0 0 auto; filter: drop-shadow(0 6px 10px rgba(0,0,0,.5)); }
.crest p { font-family: var(--font-type); font-size: 12.5px; line-height: 1.45; letter-spacing: .08em; text-transform: uppercase; color: #cfcab0; max-width: 32ch; }
.hero { display: flex; flex-direction: column; gap: 22px; padding-top: 6px; }
.hero h1 { font-size: clamp(46px, 13.5vw, 82px); text-transform: uppercase; letter-spacing: -.01em; }
.hero h1 .gold { color: var(--gold); display: block; text-shadow: 0 3px 0 #5d4512; }
.hero .lead { font-size: 18px; color: #cfcdb9; max-width: 36ch; }
.fan { position: relative; height: 150px; margin: 4px 0 6px; }
.fan .p {
  position: absolute; top: 18px; width: 108px;
  left: calc(var(--i) * (100% - 108px) / 6);
  transform: rotate(var(--r)); z-index: var(--z);
  filter: drop-shadow(0 8px 10px rgba(0,0,0,.45));
  animation: bob 4s ease-in-out infinite; animation-delay: calc(var(--i) * -.55s);
}
.fan .p svg { width: 100%; height: auto; display: block; }
@keyframes bob { 0%,100% { translate: 0 0; } 50% { translate: 0 -7px; } }
.legend { display: flex; flex-wrap: wrap; gap: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: #cfcdb9; background: var(--tape); border-radius: 999px; padding: 6px 11px 6px 8px; }
.legend i { width: 12px; height: 12px; border-radius: 50%; box-shadow: 0 0 0 2px var(--gold); }

/* HUD */
.hud { display: flex; align-items: center; gap: 12px; }
.lvl { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 0; }
.lvl b { font-family: var(--font-display); font-weight: 400; font-size: 14px; letter-spacing: .04em; }
.lvl b span { color: var(--gold); }
.lvl small { color: var(--muted); font-size: 12px; font-family: var(--font-type); letter-spacing: .06em; text-transform: uppercase; }
.pips { display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; }
.pips i { height: 8px; border-radius: 3px; background: #2c3622; }
.pips i.done { background: var(--gold); }
.pips i.now { background: var(--gold); opacity: .45; animation: blink 1.1s ease-in-out infinite; }
.pips i.gap { margin-left: 6px; }
@keyframes blink { 50% { opacity: .9; } }
.score { position: relative; display: flex; align-items: center; gap: 8px; background: var(--tape); padding: 8px 12px 8px 10px; border-radius: 12px; box-shadow: 0 3px 0 #0b0f08; }
.score svg { width: 20px; height: 20px; }
.score b { font-family: var(--font-display); font-weight: 400; font-size: 16px; min-width: 2ch; text-align: right; font-variant-numeric: tabular-nums; }
.score small { font-size: 11px; color: var(--muted); line-height: 1.1; }
.plus { position: absolute; right: 8px; top: -6px; font-family: var(--font-display); color: var(--gold); font-size: 16px; opacity: 0; pointer-events: none; }
.plus.go { animation: plus .8s ease-out both; }
@keyframes plus { 0% { opacity: 0; transform: translateY(6px); } 25% { opacity: 1; } 100% { opacity: 0; transform: translateY(-22px); } }

/* картка місії */
.mission { background: var(--tape); border-radius: 22px; overflow: hidden; box-shadow: 0 6px 0 #0b0f08, 0 20px 40px rgba(0,0,0,.4); animation: mission-in .42s cubic-bezier(.2,.9,.3,1.1) both; }
@keyframes mission-in { from { opacity: .001; transform: translateX(28px) rotate(1.5deg); } to { opacity: 1; transform: none; } }
.scene { position: relative; height: 178px; overflow: hidden; }
.scene svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.scene .badge {
  position: absolute; left: 14px; top: 14px; z-index: 2;
  font-family: var(--font-type); font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
  background: rgba(10,13,8,.72); color: var(--fg); padding: 6px 10px; border-radius: 8px; border: 1px dashed rgba(220,174,63,.5);
}
.scene::after { content: ""; position: absolute; inset: auto 0 0; height: 46px; background: linear-gradient(transparent, var(--tape)); }
.combo {
  position: absolute; left: 50%; top: 50%; z-index: 3;
  font-family: var(--font-display); font-size: clamp(30px, 9vw, 44px); color: var(--gold);
  -webkit-text-stroke: 2px #1c1505; paint-order: stroke fill; text-shadow: 0 4px 0 #1c1505;
  transform: translate(-50%, -50%) rotate(-6deg) scale(.2); opacity: 0; white-space: nowrap; pointer-events: none;
}
.combo.on { animation: pop .5s cubic-bezier(.2,1.6,.4,1) both; }
@keyframes pop { from { opacity: 0; transform: translate(-50%, -50%) rotate(-6deg) scale(.2); } to { opacity: 1; transform: translate(-50%, -50%) rotate(-6deg) scale(1); } }
.mbody { padding: 4px clamp(16px, 4.5vw, 24px) clamp(18px, 4.5vw, 24px); display: flex; flex-direction: column; gap: 16px; }
.qtitle { font-size: clamp(25px, 6.6vw, 34px); }
.tapes { display: flex; flex-direction: column; gap: 12px; }
.tape {
  appearance: none; width: 100%; cursor: pointer; text-align: left;
  font: inherit; font-size: 17px; line-height: 1.35; color: var(--fg);
  background: #1a2114; border: 0; border-radius: 12px;
  padding: 16px 16px 16px 14px;
  display: flex; gap: 14px; align-items: center; position: relative;
  box-shadow: 0 3px 0 #0b0f08, inset 0 0 0 1px rgba(255,255,255,.03);
  transition: transform .14s ease, background .14s ease;
}
.tape::before { content: ""; position: absolute; inset: 5px; border: 1.5px dashed var(--thread); border-radius: 8px; pointer-events: none; transition: border-color .14s ease; }
.tape:hover { background: #222b19; transform: translateY(-2px); }
.tape:hover::before { border-color: var(--gold-deep); }
.tape .k { flex: 0 0 auto; width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; font-family: var(--font-display); font-size: 15px; color: #1c1505; background: var(--gold); box-shadow: 0 2px 0 var(--gold-deep); }
.tape.picked { background: #34401f; transform: scale(.985); }
.tape.picked::before { border-color: var(--gold); }
.tape.dim { opacity: .45; }
.qfoot { display: flex; justify-content: space-between; align-items: center; gap: 12px; color: var(--muted); font-size: 13px; }
.link-btn { appearance: none; background: none; border: 0; padding: 6px 0; color: var(--muted); font: inherit; font-size: 15px; cursor: pointer; }
.link-btn:hover { color: var(--fg); }
/* анімації сцен */
.tw { animation: tw 2.4s ease-in-out infinite; }
@keyframes tw { 50% { opacity: .15; } }
.fl { transform-box: fill-box; transform-origin: 50% 100%; animation: fl .5s ease-in-out infinite alternate; }
@keyframes fl { to { transform: scaleY(1.12) skewX(3deg); } }
.fy { animation: fy 3.2s ease-in-out infinite; }
@keyframes fy { 50% { transform: translateY(-6px); } }
.dr { animation: dr 9s linear infinite; }
@keyframes dr { from { transform: translateX(-60px); } to { transform: translateX(420px); } }
.sp { transform-box: fill-box; transform-origin: center; animation: sp 14s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }
.pu { transform-box: fill-box; transform-origin: center; animation: pu 1.4s ease-in-out infinite; }
@keyframes pu { 50% { transform: scale(1.18); } }
.wv { transform-box: fill-box; transform-origin: 0 100%; animation: wv 1.6s ease-in-out infinite alternate; }
@keyframes wv { to { transform: skewY(-8deg); } }

/* рівень пройдено */
.levelup { background: var(--tape); border-radius: 22px; padding: clamp(22px, 6vw, 32px); display: flex; flex-direction: column; gap: 16px; align-items: flex-start; position: relative; overflow: hidden; animation: mission-in .42s cubic-bezier(.2,.9,.3,1.1) both; }
.levelup::before { content: ""; position: absolute; inset: 6px; border: 1.5px dashed rgba(220,174,63,.4); border-radius: 17px; pointer-events: none; }
.levelup h2 { font-size: clamp(30px, 8.5vw, 44px); }
.levelup .grp { display: inline-flex; align-items: center; gap: 10px; font-family: var(--font-display); font-size: clamp(20px, 5.5vw, 26px); color: var(--gold); }
.levelup .grp i { width: 18px; height: 18px; border-radius: 50%; box-shadow: 0 0 0 3px var(--gold); }
.levelup p { color: #cfcdb9; max-width: 42ch; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row svg { width: 64px; height: 64px; }

/* штаб розглядає */
.hq { min-height: 340px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; }
.hq svg { width: 96px; height: 96px; animation: spin 1.6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.hq h2 { font-size: 24px; }
.hq ul { list-style: none; margin: 0; padding: 0; font-family: var(--font-type); font-size: 14px; color: var(--muted); display: flex; flex-direction: column; gap: 6px; min-height: 66px; }
.hq li b { color: var(--gold); font-weight: 400; }

/* особова справа */
.dossier {
  position: relative; color: var(--paper-ink); font-family: var(--font-type);
  background:
    radial-gradient(circle at 18% 22%, rgba(255,255,255,.22), transparent 40%),
    radial-gradient(circle at 85% 80%, rgba(120,90,40,.18), transparent 45%),
    var(--paper);
  border-radius: 6px 18px 18px 18px;
  padding: 26px clamp(18px, 5vw, 30px) 96px;
  box-shadow: 0 18px 40px rgba(0,0,0,.5), inset 0 0 0 1px rgba(80,60,20,.25);
  display: flex; flex-direction: column; gap: 18px;
  animation: slideup .5s cubic-bezier(.2,.9,.3,1.1) both;
}
.dossier::before { content: "ОСОБОВА СПРАВА"; position: absolute; top: -26px; left: 0; background: var(--paper); color: var(--paper-ink); font-size: 11px; letter-spacing: .14em; padding: 7px 16px 5px; border-radius: 8px 8px 0 0; }
@keyframes slideup { from { transform: translateY(30px); opacity: .001; } to { transform: none; opacity: 1; } }
.dos-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; border-bottom: 2px solid var(--paper-ink); padding-bottom: 8px; }
.dos-org { display: inline-flex; align-items: center; gap: 8px; }
.dos-org img { width: 20px; height: auto; }
.dos-main { display: grid; grid-template-columns: 170px 1fr; gap: 20px; align-items: center; }
.patch-big { width: 100%; transform: rotate(-5deg); filter: drop-shadow(0 6px 6px rgba(60,40,10,.4)); animation: sewin .7s cubic-bezier(.2,1.4,.4,1) .25s both; }
.patch-big svg { width: 100%; height: auto; display: block; }
@keyframes sewin { from { transform: rotate(-30deg) scale(.4); opacity: .001; } to { transform: rotate(-5deg) scale(1); opacity: 1; } }
.fields { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.field { display: flex; flex-direction: column; gap: 1px; border-bottom: 1.5px dotted var(--paper-line); padding-bottom: 6px; }
.field small { font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: #6f5d3a; }
.field strong { font-family: var(--font-display); font-weight: 400; font-size: clamp(22px, 5.6vw, 28px); line-height: 1.05; color: #1f190f; }
.field span { font-size: 15px; }
.rar { display: inline-block; background: var(--paper-ink); color: var(--paper); padding: 2px 8px; border-radius: 4px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }
.char { font-size: 16px; line-height: 1.55; }
.char b { font-weight: 400; text-transform: uppercase; letter-spacing: .1em; font-size: 11px; color: #6f5d3a; display: block; margin-bottom: 4px; }
.skills { display: flex; flex-direction: column; gap: 8px; }
.skill { display: grid; grid-template-columns: 128px 1fr 48px; gap: 10px; align-items: center; font-size: 14px; }
.segs { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; }
.segs i { height: 12px; border-radius: 2px; background: rgba(42,34,22,.15); }
.segs i.f { background: var(--paper-ink); animation: segin .25s ease both; }
@keyframes segin { from { transform: scaleY(.2); } to { transform: none; } }
.skill em { font-style: normal; text-align: right; }
.stamp {
  position: absolute; right: 18px; bottom: 22px;
  font-family: var(--font-display); color: var(--red); font-size: 22px; letter-spacing: .04em;
  border: 4px double var(--red); border-radius: 8px; padding: 6px 12px 4px;
  transform: rotate(-13deg); opacity: .82; mix-blend-mode: multiply;
  animation: slam .45s cubic-bezier(.3,1.6,.5,1) .9s both; pointer-events: none;
}
@keyframes slam { from { transform: rotate(-13deg) scale(2.4); opacity: 0; } 60% { opacity: .9; } to { transform: rotate(-13deg) scale(1); opacity: .82; } }
.fact { background: var(--tape); border-radius: 14px; padding: 18px; display: flex; gap: 14px; align-items: flex-start; position: relative; }
.fact::before { content: ""; position: absolute; inset: 5px; border: 1.5px dashed var(--thread); border-radius: 10px; pointer-events: none; }
.fact .pin { flex: 0 0 auto; width: 38px; height: 38px; border-radius: 50%; background: var(--gold); display: grid; place-items: center; color: #1c1505; font-family: var(--font-display); font-size: 18px; }
.fact div { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.fact .real { color: var(--gold); }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.toast { font-size: 14px; color: var(--gold); min-height: 1.4em; text-align: center; margin-top: -8px; }

/* заклик */
.cta { position: relative; overflow: hidden; background: linear-gradient(140deg, #3c4826 0%, #273019 70%); border-radius: 20px; padding: clamp(22px, 6vw, 32px); display: flex; flex-direction: column; gap: 14px; }
.cta::before { content: ""; position: absolute; inset: 6px; border: 1.5px dashed rgba(220,174,63,.35); border-radius: 15px; pointer-events: none; }
.cta h2 { font-size: clamp(26px, 7vw, 36px); }
.cta p { color: #dad9c5; max-width: 44ch; }
.phone { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.phone .num { font-family: var(--font-type); font-size: 20px; letter-spacing: .04em; user-select: all; }
.phone .btn { font-size: 13px; padding: 10px 14px; }
.cta small { color: #b9b9a2; font-size: 13px; }

/* моральна панель */
.panel {
  background-color: #262d1e;
  background-image: radial-gradient(rgba(0,0,0,.35) 1px, transparent 1.4px), radial-gradient(rgba(255,255,255,.05) 1px, transparent 1.4px);
  background-size: 6px 6px, 6px 6px; background-position: 0 0, 3px 3px;
  border-radius: 20px; padding: 22px clamp(12px, 4vw, 24px);
  box-shadow: inset 0 0 0 2px #1a2014, inset 0 0 30px rgba(0,0,0,.4);
  display: flex; flex-direction: column; gap: 16px;
}
.panel h3 { font-size: 20px; }
.panel .sub { color: var(--muted); font-size: 14px; }
.grp-title { display: flex; align-items: center; gap: 8px; font-family: var(--font-type); font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; color: #cfcab0; margin-top: 4px; }
.grp-title i { width: 10px; height: 10px; border-radius: 50%; box-shadow: 0 0 0 2px var(--gold); }
.board { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px 6px; }
.mini { width: calc(20% - 5px); min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 5px; text-align: center; font-size: 11px; line-height: 1.2; color: var(--muted); }
.mini svg { width: 100%; max-width: 80px; height: auto; display: block; filter: grayscale(1) brightness(.55) contrast(.9); }
.mini.me svg { filter: drop-shadow(0 0 12px rgba(220,174,63,.6)); }
.mini.me { color: var(--gold); }
footer { font-size: 12px; color: var(--muted); text-align: center; display: flex; flex-direction: column; gap: 4px; }

.screen { animation: rise .32s ease both; }
@keyframes rise { from { opacity: .001; transform: translateY(10px); } to { opacity: 1; transform: none; } }
/* живий тактичний фон */
.wrap { position: relative; z-index: 1; }
.tac { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; opacity: .4; transition: opacity .8s ease; }
body.home .tac { opacity: 1; }
.tac::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse 90% 70% at 50% 45%, transparent 35%, rgba(8,10,6,.6) 100%); }
.tac-grid { position: absolute; inset: -140px; transform: translate(calc(var(--px, 0) * -14px), calc(var(--py, 0) * -14px)); transition: transform .5s ease-out; }
.tac-grid::before { content: ""; position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(220,174,63,.09) 1px, transparent 1px),
    linear-gradient(90deg, rgba(220,174,63,.09) 1px, transparent 1px),
    linear-gradient(rgba(255,255,255,.028) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.028) 1px, transparent 1px);
  background-size: 65px 65px, 65px 65px, 13px 13px, 13px 13px;
  animation: tacdrift 16s linear infinite; }
@keyframes tacdrift { to { transform: translate(65px, 65px); } }
.tac-rings, .tac-radar { position: absolute; width: 160vmax; height: 160vmax; left: calc(80% - 80vmax); top: calc(18% - 80vmax); border-radius: 50%; opacity: 0; transition: opacity .8s ease; }
body.home .tac-rings, body.home .tac-radar { opacity: 1; }
.tac-rings {
  background:
    linear-gradient(rgba(220,174,63,.16), rgba(220,174,63,.16)) center / 1px 100% no-repeat,
    linear-gradient(90deg, rgba(220,174,63,.16), rgba(220,174,63,.16)) center / 100% 1px no-repeat,
    repeating-radial-gradient(circle, transparent 0 89px, rgba(220,174,63,.14) 89px 90px);
  -webkit-mask: radial-gradient(circle, #000 0 22%, transparent 55%); mask: radial-gradient(circle, #000 0 22%, transparent 55%); }
.tac-radar {
  background: conic-gradient(from 0deg, transparent 0 290deg, rgba(220,174,63,0) 280deg, rgba(220,174,63,.13) 358deg, rgba(240,205,110,.42) 359.4deg, transparent 360deg);
  -webkit-mask: radial-gradient(circle, #000 0 20%, transparent 52%); mask: radial-gradient(circle, #000 0 20%, transparent 52%);
  animation: tacsweep 7s linear infinite; }
@keyframes tacsweep { to { transform: rotate(360deg); } }
.tac-scan { position: absolute; left: 0; right: 0; top: -140px; height: 140px; background: linear-gradient(to bottom, transparent, rgba(220,174,63,.03) 80%, rgba(240,205,110,.18) 99%, transparent); animation: tacscan 9s linear infinite; }
@keyframes tacscan { to { transform: translateY(calc(100vh + 140px)); } }
.blip { position: absolute; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%; background: #f0cd6e; box-shadow: 0 0 12px #dcae3f; opacity: 0; animation: tacblip 7s linear infinite; }
.blip.red { background: #e2574c; box-shadow: 0 0 12px #c0392f; }
.blip::before { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 1.5px solid currentColor; color: #dcae3f; animation: tacping 7s ease-out infinite; animation-delay: inherit; }
.blip.red::before { color: #e2574c; }
.blip span { position: absolute; left: 14px; top: -7px; font-family: var(--font-type); font-size: 10px; letter-spacing: .12em; color: rgba(240,205,110,.9); white-space: nowrap; }
.blip.l span { left: auto; right: 14px; }
.blip.red span { color: rgba(240,140,130,.95); }
body:not(.home) .blip { display: none; }
@keyframes tacblip { 0% { opacity: 0; transform: scale(.3); } 2% { opacity: 1; transform: scale(1.25); } 6% { transform: scale(1); } 45% { opacity: .55; } 75% { opacity: 0; } 100% { opacity: 0; } }
@keyframes tacping { 0% { transform: scale(1); opacity: .9; } 18% { transform: scale(4.5); opacity: 0; } 100% { opacity: 0; } }
.tac-c { position: absolute; width: 22px; height: 22px; border: 2px solid rgba(220,174,63,.5); }
.tac-c.a { top: 8px; left: 8px; border-right: 0; border-bottom: 0; }
.tac-c.b { top: 8px; right: 8px; border-left: 0; border-bottom: 0; }
.tac-c.c { bottom: 8px; left: 8px; border-right: 0; border-top: 0; }
.tac-c.d { bottom: 8px; right: 8px; border-left: 0; border-top: 0; }
.tac-read { position: absolute; left: 16px; bottom: 14px; font-family: var(--font-type); font-size: 10px; letter-spacing: .14em; color: rgba(220,174,63,.55); opacity: 0; transition: opacity .8s ease; }
body.home .tac-read { opacity: 1; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001s !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; transition: none !important; }
}
@media (max-width: 480px) {
  .fan { height: 120px; }
  .fan .p { width: 84px; left: calc(var(--i) * (100% - 84px) / 6); }
  .dos-main { grid-template-columns: 1fr; justify-items: center; text-align: center; }
  .patch-big { width: 190px; }
  .fields { width: 100%; text-align: left; }
  .skill { grid-template-columns: 100px 1fr 42px; font-size: 13px; }
  .actions { grid-template-columns: 1fr; }
  .stamp { font-size: 19px; right: 16px; bottom: 22px; }
  .mini { width: calc(25% - 5px); }
  .row svg { width: 54px; height: 54px; }
}
</style>

        '<g class="sp" style="transform-origin:180px 150px"><path d="M180 60 v-30 M90 150 h-30 M270 150 h30 M116 86 l-20 -20 M244 86 l20 -20" stroke="#ffe9b8" stroke-width="5" stroke-linecap="round" opacity=".6"/></g><path d="M0 180 V156 h360 V180Z" fill="#2a1712"/>' +
        cat(80, 156, .9, "#2a1712") + cat(130, 156, 1, "#2a1712") + cat(180, 156, 1.15, "#2a1712") + cat(230, 156, 1, "#2a1712") + cat(280, 156, .9, "#2a1712") +
        '<path class="pu" d="M180 60 l6 12 13 2 -9 9 2 13 -12 -6 -12 6 2 -13 -9 -9 13 -2Z" fill="#fff4c2" stroke="#7a5a12" stroke-width="2"/>';
    }},
    { name: "Полігон", glow: "rgba(150,180,90,.3)", svg: function () {
      return '<defs><linearGradient id="g8" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b9d6c2"/><stop offset="1" stop-color="#e8e2c4"/></linearGradient></defs><rect width="360" height="180" fill="url(#g8)"/>' +
        '<path d="M0 180 V120 Q90 104 180 118 T360 112 V180Z" fill="#7d8f4e"/><path d="M0 180 V146 Q160 132 360 148 V180Z" fill="#66783e"/>' +
        '<g fill="#3a3324"><ellipse cx="70" cy="150" rx="14" ry="6"/><ellipse cx="96" cy="150" rx="14" ry="6"/><ellipse cx="122" cy="150" rx="14" ry="6"/></g><g fill="#5a5038"><ellipse cx="70" cy="147" rx="9" ry="3"/><ellipse cx="96" cy="147" rx="9" ry="3"/><ellipse cx="122" cy="147" rx="9" ry="3"/></g>' +
        '<rect x="180" y="104" width="64" height="8" rx="2" fill="#8a5a33"/><rect x="186" y="112" width="5" height="34" fill="#6b4a2c"/><rect x="233" y="112" width="5" height="34" fill="#6b4a2c"/>' +
        '<rect x="288" y="60" width="4" height="90" fill="#4a3a28"/><path class="wv" d="M292 62 h36 l-8 12 8 12 h-36z" fill="#dcae3f"/>' +
        '<rect x="30" y="70" width="3" height="60" fill="#4a3a28"/><path class="wv" style="animation-delay:.5s" d="M33 72 h24 l-6 8 6 8 h-24z" fill="#c0392f"/>' +
        cat(156, 140, .85, "#2a3020");
    }},
    { name: "Фінальна місія", glow: "rgba(200,70,90,.3)", svg: function () {
      return '<defs><linearGradient id="g7" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4a1630"/><stop offset="1" stop-color="#b8452f"/></linearGradient><pattern id="g7d" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="5" cy="5" r="1.6" fill="#ffffff" opacity=".12"/></pattern></defs>' +
        '<rect width="360" height="180" fill="url(#g7)"/><rect width="360" height="180" fill="url(#g7d)"/>' +
        '<path class="pu" d="M180 22 L198 58 L238 46 L218 82 L256 102 L214 110 L222 150 L188 126 L162 158 L156 118 L114 124 L140 92 L106 64 L148 64Z" fill="#ffd34d" stroke="#1c1505" stroke-width="3" stroke-linejoin="round"/>' +
        '<text x="180" y="104" text-anchor="middle" font-family="Dela Gothic One, Arial Black, sans-serif" font-size="28" fill="#1c1505">GO!</text>' +
        '<g class="fy"><rect x="28" y="40" width="76" height="34" rx="12" fill="#fff"/><path d="M52 74 l-6 12 16 -12Z" fill="#fff"/><text x="66" y="63" text-anchor="middle" font-family="PT Mono, monospace" font-size="15" fill="#1c1505">остання!</text></g>' +
        '<g class="fy" style="animation-delay:1.1s"><rect x="262" y="112" width="74" height="34" rx="12" fill="#fff"/><path d="M314 146 l8 12 -18 -12Z" fill="#fff"/><text x="299" y="135" text-anchor="middle" font-family="PT Mono, monospace" font-size="15" fill="#1c1505">і посада</text></g>';
    }}
  ];
  var PAW = '<svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="16" rx="5.5" ry="4.6" fill="#dcae3f"/><circle cx="5.5" cy="10" r="2.4" fill="#dcae3f"/><circle cx="9.5" cy="6" r="2.4" fill="#dcae3f"/><circle cx="14.5" cy="6" r="2.4" fill="#dcae3f"/><circle cx="18.5" cy="10" r="2.4" fill="#dcae3f"/></svg>';

  /* ---------- екрани ---------- */
  var app = document.getElementById("app");
  var state = { i: 0, picks: [], busy: false, grp: null };
  var TOTAL = 8;
  function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function P(id) { currentField = GROUPS[ROLES[id].g].field; return patch(id); }

  function renderStart() {
    document.body.classList.add("home");
    document.body.style.setProperty("--glow", "rgba(220,174,63,.13)");
    var show = ["bpla", "rozvid", "medyk", "bmp", "fpv", "zenit", "kukhar"];
    var rot = [-14, -8, -3, 2, 6, 10, 15], z = [1, 2, 3, 7, 4, 5, 6];
    var fan = show.map(function (k, i) { return '<div class="p" style="--i:' + i + ';--r:' + rot[i] + 'deg;--z:' + z[i] + '">' + P(k) + '</div>'; }).join("");
    var legend = GORDER.map(function (g) { return '<span><i style="background:' + GROUPS[g].field + '"></i>' + GROUPS[g].name + '</span>'; }).join("");
    app.innerHTML =
      '<section class="hero screen">' +
        '<div class="crest"><img src="' + LOGO + '" alt="Емблема Південного ОТО НГУ"><p>Південне оперативно-територіальне обʼєднання Національної гвардії України</p></div>' +
        '<h1>Який ти<span class="gold">котик</span>НГУ?</h1>' +
        '<div class="fan" aria-hidden="true">' + fan + '</div>' +
        '<p class="lead">8 місій. Спершу штаб визначить твій напрям, потім посаду. У грі 20 посад з анкети НГУ, з яких реально починають службу за контрактом.</p>' +
        '<div class="legend">' + legend + '</div>' +
        '<button class="btn" id="go" type="button">Почати гру</button>' +
      '</section>';
    document.getElementById("go").addEventListener("click", function () { document.body.classList.remove("home"); state.i = 0; state.picks = []; state.grp = null; renderQ(); });
  }

  function mix(arr) { for (var i = arr.length - 1; i > 0; i--) { var k = Math.floor(Math.random() * (i + 1)); var t = arr[i]; arr[i] = arr[k]; arr[k] = t; } return arr; }
  function currentQ() { return state.i < 5 ? Q1[state.i] : Q2[state.grp][state.i - 5]; }

  function renderQ() {
    state.busy = false;
    var q = currentQ(), sc = SCENES[state.i];
    var order = mix([0, 1, 2, 3]); state.order = order;
    document.body.style.setProperty("--glow", state.i < 5 ? sc.glow : GROUPS[state.grp].glow);
    var pips = ""; for (var p = 0; p < TOTAL; p++) pips += '<i class="' + (p < state.i ? "done" : p === state.i ? "now" : "") + (p === 5 ? " gap" : "") + '"></i>';
    var stage = state.i < 5 ? "Етап 1 · напрям" : "Етап 2 · " + GROUPS[state.grp].name;
    app.innerHTML =
      '<div class="hud">' +
        '<div class="lvl"><b>Місія <span>' + (state.i + 1) + '</span> з ' + TOTAL + '</b><small>' + stage + '</small><div class="pips">' + pips + '</div></div>' +
        '<div class="score">' + PAW + '<b id="pts">' + (state.i * 10) + '</b><small>мур-<br>очок</small><span class="plus" id="plus">+10</span></div>' +
      '</div>' +
      '<section class="mission">' +
        '<div class="scene"><svg viewBox="0 0 360 180" preserveAspectRatio="xMidYMid slice" aria-hidden="true">' + sc.svg() + '</svg>' +
          '<span class="badge">Місія ' + (state.i + 1) + ' · ' + sc.name + '</span><span class="combo" id="combo"></span></div>' +
        '<div class="mbody"><h2 class="qtitle">' + esc(q.q) + '</h2>' +
          '<div class="tapes">' + order.map(function (j, d) {
            var a = q.a[j];
            return '<button class="tape" type="button" data-j="' + j + '" id="t-' + state.i + '-' + d + '"><span class="k">' + KEYS[d] + '</span><span>' + esc(a[0]) + '</span></button>';
          }).join("") + '</div></div>' +
      '</section>' +
      '<div class="qfoot">' + (state.i > 0 ? '<button class="link-btn" id="back" type="button">← Попередня місія</button>' : '<span>Обирай те, що найближче</span>') + '<span>мяу</span></div>';
    Array.prototype.forEach.call(app.querySelectorAll(".tape"), function (b) {
      b.addEventListener("click", function () { pick(Number(b.getAttribute("data-j"))); });
    });
    var back = document.getElementById("back");
    if (back) back.addEventListener("click", function () { if (state.busy) return; state.i--; state.picks.length = state.i; renderQ(); });
  }

  function pick(j) {
    if (state.busy) return; state.busy = true;
    state.picks[state.i] = j;
    Array.prototype.forEach.call(app.querySelectorAll(".tape"), function (b) { b.classList.add(Number(b.getAttribute("data-j")) === j ? "picked" : "dim"); });
    var combo = document.getElementById("combo");
    combo.textContent = REACTS[(state.i + j) % REACTS.length];
    combo.classList.add("on");
    document.getElementById("plus").classList.add("go");
    document.getElementById("pts").textContent = (state.i + 1) * 10;
    var pip = app.querySelector(".pips i.now"); if (pip) pip.classList.replace("now", "done");
    setTimeout(function () {
      if (state.i === 4) { state.grp = groupOf(state.picks); state.i++; renderLevelUp(); }
      else if (state.i < TOTAL - 1) { state.i++; renderQ(); }
      else renderHQ();
      window.scrollTo(0, 0);
    }, reduce ? 150 : 760);
  }

  document.addEventListener("keydown", function (e) {
    if (!app.querySelector(".tape")) return;
    var m = { "1": 0, "2": 1, "3": 2, "4": 3 }[e.key];
    if (m !== undefined) pick(state.order[m]);
  });

  function renderLevelUp() {
    var g = GROUPS[state.grp];
    document.body.style.setProperty("--glow", g.glow);
    var row = R.filter(function (r) { return r.g === state.grp; }).map(function (r) { return P(r.id); }).join("");
    var n = R.filter(function (r) { return r.g === state.grp; }).length;
    app.innerHTML =
      '<section class="levelup">' +
        '<span class="eyebrow">Етап 1 пройдено · 50 мур-очок</span>' +
        '<h2>Напрям визначено</h2>' +
        '<span class="grp"><i style="background:' + g.field + '"></i>' + g.name + '</span>' +
        '<div class="row" aria-hidden="true">' + row + '</div>' +
        '<p>У цьому напрямі ' + n + ' ' + (n < 5 ? "посади" : "посад") + '. Ще 3 місії, і штаб назве твою.</p>' +
        '<button class="btn" id="next" type="button">Далі, до етапу 2</button>' +
        '<button class="link-btn" id="back" type="button">← Змінити відповідь</button>' +
      '</section>';
    document.getElementById("next").addEventListener("click", function () { renderQ(); window.scrollTo(0, 0); });
    document.getElementById("back").addEventListener("click", function () { state.i = 4; state.picks.length = 4; renderQ(); });
  }

  function renderHQ() {
    var id = roleOf(state.picks);
    var lines = [["Перевіряємо вусики", "ок"], ["Рахуємо мурчання", "ок"], ["Підбираємо посаду", "є"], ["Пришиваємо шеврон", "готово"]];
    app.innerHTML =
      '<section class="hq screen">' +
        '<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="40" fill="none" stroke="#2c3622" stroke-width="8"/><circle cx="50" cy="50" r="40" fill="none" stroke="#dcae3f" stroke-width="8" stroke-dasharray="2 2.6"/><path d="M50 10 a40 40 0 0 1 40 40" fill="none" stroke="#efebd9" stroke-width="8" stroke-linecap="round" opacity=".7"/></svg>' +
        '<span class="eyebrow">Місії виконано: 8 з 8 · 80 мур-очок</span><h2>Штаб розглядає справу</h2><ul id="hql"></ul>' +
      '</section>';
    var ul = document.getElementById("hql"), step = reduce ? 60 : 380;
    lines.forEach(function (l, i) { setTimeout(function () { var li = document.createElement("li"); li.innerHTML = l[0] + "... <b>" + l[1] + "</b>"; ul.appendChild(li); }, step * (i + 1)); });
    setTimeout(function () { renderResult(id); }, step * 5 + 150);
  }

  function renderResult(id) {
    document.body.style.setProperty("--glow", "rgba(220,174,63,.16)");
    var r = ROLES[id], pr = PARTNER[id];
    var no = "КТ-" + (1000 + R.indexOf(r) * 37 + state.picks.reduce(function (a, b, i) { return a + b * (i + 3); }, 0));
    var shareText = "Пройшов гру «Який ти котик НГУ»: я " + r.name + ", позивний «" + r.call + "». Мій ідеальний напарник: " + ROLES[pr[0]].name + " 🐾 А ти який котик?";
    var skills = r.skills.map(function (s, si) {
      var segs = ""; for (var i = 0; i < 10; i++) segs += '<i' + (i < s[1] ? ' class="f" style="animation-delay:' + (0.6 + si * 0.12 + i * 0.03).toFixed(2) + 's"' : "") + '></i>';
      return '<div class="skill"><span>' + s[0] + '</span><span class="segs" role="img" aria-label="' + s[0] + ': ' + s[1] + ' з 10">' + segs + '</span><em>' + s[1] + '/10</em></div>';
    }).join("");
    var board = GORDER.map(function (g) {
      return '<div class="grp-title"><i style="background:' + GROUPS[g].field + '"></i>' + GROUPS[g].name + '</div><div class="board">' +
        R.filter(function (x) { return x.g === g; }).map(function (x) {
          return '<div class="mini' + (x.id === id ? " me" : "") + '">' + P(x.id) + '<span>' + x.vos.replace(" (з бойової підготовки)", "").replace(" (автобуса) мікроавтобуса D, E", " D, E") + (x.id === id ? "<br>це ти" : "") + '</span></div>';
        }).join("") + '</div>';
    }).join("");
    var big = P(id);

    app.innerHTML =
      '<div style="height:18px"></div>' +
      '<article class="dossier">' +
        '<div class="dos-top"><span>Справа № ' + no + '</span><span class="dos-org"><img src="' + LOGO + '" alt="">Південне ОТО НГУ</span></div>' +
        '<div class="dos-main"><div class="patch-big">' + big + '</div>' +
          '<div class="fields">' +
            '<div class="field"><small>Спеціальність</small><strong>' + r.name + '</strong></div>' +
            '<div class="field"><small>Посада в анкеті НГУ</small><span>' + r.vos + '</span></div>' +
            '<div class="field"><small>Позивний · напрям</small><span>«' + r.call + '» · ' + GROUPS[r.g].name + '</span></div>' +
            '<div class="field"><small>Ідеальний напарник</small><span><span class="rar">' + ROLES[pr[0]].name + '</span><br>' + pr[1] + '</span></div>' +
          '</div></div>' +
        '<p class="char"><b>Характеристика</b>' + esc(r.desc) + '</p>' +
        '<div class="skills">' + skills + '</div>' +
        '<div class="stamp" aria-hidden="true">ЗАРАХОВАНО</div>' +
      '</article>' +
      '<div class="fact screen"><span class="pin" aria-hidden="true">!</span><div><span class="eyebrow">Що робить на службі</span><p>' + esc(r.duty) + '</p>' + (r.fact ? '<p class="real">Реально в НГУ: ' + esc(r.fact) + '</p>' : "") + '</div></div>' +
      '<div class="actions"><button class="btn alt" id="copy" type="button">Скопіювати результат</button><button class="btn alt" id="again" type="button">Пройти ще раз</button></div>' +
      '<p class="toast" id="toast"></p>' +
      '<section class="cta screen">' +
        '<span class="eyebrow">Тепер без котячих жартів</span>' +
        '<h2>Хочеш у команду по-справжньому?</h2>' +
        '<p>Посада «' + esc(r.vos) + '» є в анкеті на офіційному сайті НГУ. Обери свою область і цю посаду, і з тобою звʼяжуться.</p>' +
        '<a class="btn" href="https://join.ngu.gov.ua/" target="_blank" rel="noopener">Анкета на join.ngu.gov.ua</a>' +
        '<div class="phone"><span class="num">063 236 02 22</span><button class="btn alt" id="copyPhone" type="button">Скопіювати номер</button></div>' +
        '<small>Південне відділення комплектування за контрактом, Одеса</small>' +
      '</section>' +
      '<section class="panel screen">' +
        '<h3>Моральна панель · 1 з 20</h3>' +
        '<p class="sub">Твій шеврон уже на липучці. Решту 19 відкриють побратими: скинь їм гру.</p>' + board +
      '</section>';

    function toast(t) { var el = document.getElementById("toast"); if (el) el.textContent = t; }
    function copy(text, ok) {
      try { navigator.clipboard.writeText(text).then(function () { toast(ok); }, function () { toast(text); }); }
      catch (e) { toast(text); }
    }
    document.getElementById("copy").addEventListener("click", function () { copy(shareText, "Скопійовано. Встав у пост або сторіс"); });
    document.getElementById("copyPhone").addEventListener("click", function () { copy("063 236 02 22", "Номер скопійовано"); });
    document.getElementById("again").addEventListener("click", function () { state.i = 0; state.picks = []; state.grp = null; renderStart(); window.scrollTo(0, 0); });
    window.scrollTo(0, 0);
  }

  /* ---------- живий фон ---------- */
  var tac = document.querySelector(".tac");
  function placeBlips() {
    if (!tac) return;
    var W = window.innerWidth, H = window.innerHeight, cx = W * 0.8, cy = H * 0.18;
    Array.prototype.forEach.call(tac.querySelectorAll(".blip"), function (b) {
      var x = parseFloat(b.getAttribute("data-x")) * W, y = parseFloat(b.getAttribute("data-y")) * H;
      var a = (Math.atan2(x - cx, cy - y) * 180 / Math.PI + 360) % 360;
      b.style.left = x + "px"; b.style.top = y + "px"; b.style.animationDelay = (a / 360 * 7).toFixed(2) + "s";
    });
  }
  placeBlips();
  window.addEventListener("resize", placeBlips);
  if (tac && !reduce) {
    window.addEventListener("pointermove", function (e) {
      tac.style.setProperty("--px", (e.clientX / window.innerWidth - 0.5).toFixed(3));
      tac.style.setProperty("--py", (e.clientY / window.innerHeight - 0.5).toFixed(3));
    }, { passive: true });
    var scanN = 1;
    setInterval(function () { scanN = scanN % 99 + 1; var n = document.getElementById("tacN"); if (n) n.textContent = (scanN < 10 ? "0" : "") + scanN; }, 7000);
  }

  window.__kotyk = { R: R, Q1: Q1, Q2: Q2, groupOf: groupOf, roleOf: roleOf };
  renderStart();
})();
</script>

</body>
</html>
