<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
.draft{background:#b8322a;color:#fff;font:600 13px/1.4 "Golos Text",system-ui,sans-serif;text-align:center;padding:8px max(16px,env(safe-area-inset-left,0px))}</style>
<title>Який ти котик НГУ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: тканина ріпстоп як фон; питання на «нашивках з позивним»; результат як особова справа на крафт-папері з вишитим шевроном; моральна панель з колекцією */
:root {
  color-scheme: dark;
  --bg: #10140d;
  --cloth: #171d12;
  --tape: #232b1b;
  --tape-hi: #2c3622;
  --thread: #4a5634;
  --fg: #efebd9;
  --muted: #a7ab92;
  --gold: #dcae3f;
  --gold-deep: #a9801f;
  --red: #b8322a;
  --paper: #d9c69c;
  --paper-ink: #2a2216;
  --paper-line: #b39c6c;
  --font-display: "Dela Gothic One", "Arial Black", Impact, system-ui, sans-serif;
  --font-body: "Golos Text", "Segoe UI", system-ui, sans-serif;
  --font-type: "PT Mono", "Courier New", ui-monospace, monospace;
  --glow: rgba(220,174,63,.13);
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background-color: var(--bg);
  background-image:
    radial-gradient(1000px 560px at 85% -12%, var(--glow), transparent 62%),
    radial-gradient(800px 600px at -15% 105%, rgba(74,86,52,.45), transparent 62%),
    linear-gradient(rgba(255,255,255,.028) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.028) 1px, transparent 1px);
  background-size: auto, auto, 13px 13px, 13px 13px;
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  overflow-x: hidden;
}
.wrap {
  max-width: 620px;
  margin: 0 auto;
  padding-block: 18px 44px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
  gap: 22px;
}
.topbar {
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
  font-family: var(--font-type); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted);
}
.topbar b { color: var(--gold); font-weight: 400; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; margin: 0; line-height: 1.02; text-wrap: balance; }
p { margin: 0; }
.eyebrow { font-family: var(--font-type); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); }
#app { display: flex; flex-direction: column; gap: 22px; }

/* кнопки */
.btn {
  appearance: none; border: 0; cursor: pointer; text-decoration: none;
  display: inline-flex; justify-content: center; align-items: center; gap: 10px;
  font-family: var(--font-display); font-size: 18px; letter-spacing: .02em;
  color: #1c1505; background: var(--gold);
  padding: 18px 24px; border-radius: 14px;
  box-shadow: 0 4px 0 var(--gold-deep), 0 10px 24px rgba(0,0,0,.35);
  transition: transform .12s ease, box-shadow .12s ease, filter .12s ease;
  position: relative;
}
.btn::after { content: ""; position: absolute; inset: 5px; border: 1.5px dashed rgba(28,21,5,.35); border-radius: 10px; pointer-events: none; }
.btn:hover { filter: brightness(1.06); }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--gold-deep), 0 4px 10px rgba(0,0,0,.35); }
.btn.alt { background: var(--tape-hi); color: var(--fg); box-shadow: 0 4px 0 #11160d, 0 10px 24px rgba(0,0,0,.3); font-size: 15px; padding: 15px 18px; }
.btn.alt::after { border-color: rgba(239,235,217,.22); }
.btn:focus-visible, .tape:focus-visible, .link-btn:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }

/* старт */
.hero { display: flex; flex-direction: column; gap: 22px; padding-top: 6px; }
.hero h1 { font-size: clamp(46px, 13.5vw, 82px); text-transform: uppercase; letter-spacing: -.01em; }
.hero h1 .gold { color: var(--gold); display: block; text-shadow: 0 3px 0 #5d4512; }
.hero .lead { font-size: 18px; color: #cfcdb9; max-width: 34ch; }
.fan { position: relative; height: 150px; margin: 4px 0 6px; }
.fan .p {
  position: absolute; top: 18px; width: 108px;
  left: calc(var(--i) * (100% - 108px) / 6);
  transform: rotate(var(--r));
  z-index: var(--z);
  filter: drop-shadow(0 8px 10px rgba(0,0,0,.45));
  animation: bob 4s ease-in-out infinite; animation-delay: calc(var(--i) * -.55s);
}
.fan .p svg { width: 100%; height: auto; display: block; }
@keyframes bob { 0%,100% { translate: 0 0; } 50% { translate: 0 -7px; } }
.facts-row { display: flex; flex-wrap: wrap; gap: 8px; }
.tag {
  font-family: var(--font-type); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted);
  padding: 7px 11px; border-radius: 8px; background: var(--tape); border: 1.5px dashed var(--thread);
}

/* лого */
.crest { display: flex; align-items: center; gap: 14px; }
.crest img { width: 64px; height: auto; flex: 0 0 auto; filter: drop-shadow(0 6px 10px rgba(0,0,0,.5)); }
.crest p { font-family: var(--font-type); font-size: 12.5px; line-height: 1.45; letter-spacing: .08em; text-transform: uppercase; color: #cfcab0; max-width: 32ch; }

/* міні-гра: HUD */
.hud { display: flex; align-items: center; gap: 12px; }
.lvl { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 0; }
.lvl b { font-family: var(--font-display); font-weight: 400; font-size: 14px; letter-spacing: .04em; }
.lvl b span { color: var(--gold); }
.pips { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.pips i { height: 8px; border-radius: 3px; background: #2c3622; }
.pips i.done { background: var(--gold); }
.pips i.now { background: var(--gold); opacity: .45; animation: blink 1.1s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .9; } }
.score { position: relative; display: flex; align-items: center; gap: 8px; background: var(--tape); padding: 8px 12px 8px 10px; border-radius: 12px; box-shadow: 0 3px 0 #0b0f08; }
.score svg { width: 20px; height: 20px; }
.score b { font-family: var(--font-display); font-weight: 400; font-size: 16px; min-width: 2ch; text-align: right; font-variant-numeric: tabular-nums; }
.score small { font-size: 11px; color: var(--muted); line-height: 1.1; }
.plus { position: absolute; right: 8px; top: -6px; font-family: var(--font-display); color: var(--gold); font-size: 16px; opacity: 0; pointer-events: none; }
.plus.go { animation: plus .8s ease-out both; }
@keyframes plus { 0% { opacity: 0; transform: translateY(6px); } 25% { opacity: 1; } 100% { opacity: 0; transform: translateY(-22px); } }

/* міні-гра: картка місії */
.mission { background: var(--tape); border-radius: 22px; overflow: hidden; box-shadow: 0 6px 0 #0b0f08, 0 20px 40px rgba(0,0,0,.4); animation: mission-in .42s cubic-bezier(.2,.9,.3,1.1) both; }
@keyframes mission-in { from { opacity: .001; transform: translateX(28px) rotate(1.5deg); } to { opacity: 1; transform: none; } }
.scene { position: relative; height: 178px; overflow: hidden; }
.scene svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.scene .badge {
  position: absolute; left: 14px; top: 14px; z-index: 2;
  font-family: var(--font-type); font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
  background: rgba(10,13,8,.72); color: var(--fg); padding: 6px 10px; border-radius: 8px; border: 1px dashed rgba(220,174,63,.5);
}
.scene::after { content: ""; position: absolute; inset: auto 0 0; height: 46px; background: linear-gradient(transparent, var(--tape)); }
.combo {
  position: absolute; left: 50%; top: 50%; z-index: 3;
  font-family: var(--font-display); font-size: clamp(30px, 9vw, 44px); color: var(--gold);
  -webkit-text-stroke: 2px #1c1505; paint-order: stroke fill; text-shadow: 0 4px 0 #1c1505;
  transform: translate(-50%, -50%) rotate(-6deg) scale(.2); opacity: 0; white-space: nowrap; pointer-events: none;
}
.combo.on { animation: pop .5s cubic-bezier(.2,1.6,.4,1) both; }
@keyframes pop { from { opacity: 0; transform: translate(-50%, -50%) rotate(-6deg) scale(.2); } to { opacity: 1; transform: translate(-50%, -50%) rotate(-6deg) scale(1); } }
.mbody { padding: 4px clamp(16px, 4.5vw, 24px) clamp(18px, 4.5vw, 24px); display: flex; flex-direction: column; gap: 16px; }
.mission .tape { background: #1a2114; }
.mission .tape:hover { background: #222b19; }
.mission .tape.picked { background: #34401f; }
/* анімації сцен */
.tw { animation: tw 2.4s ease-in-out infinite; }
@keyframes tw { 50% { opacity: .15; } }
.fl { transform-box: fill-box; transform-origin: 50% 100%; animation: fl .5s ease-in-out infinite alternate; }
@keyframes fl { to { transform: scaleY(1.12) skewX(3deg); } }
.fy { animation: fy 3.2s ease-in-out infinite; }
@keyframes fy { 50% { transform: translateY(-6px); } }
.dr { animation: dr 9s linear infinite; }
@keyframes dr { from { transform: translateX(-60px); } to { transform: translateX(420px); } }
.sp { transform-box: fill-box; transform-origin: center; animation: sp 14s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }
.pu { transform-box: fill-box; transform-origin: center; animation: pu 1.4s ease-in-out infinite; }
@keyframes pu { 50% { transform: scale(1.18); } }

/* питання */
.qhead { display: flex; align-items: center; gap: 14px; }
.ring { width: 64px; height: 64px; flex: 0 0 auto; }
.ring text { font-family: var(--font-display); fill: var(--fg); font-size: 15px; }
.qhead .meta { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.qhead .meta span:last-child { color: var(--muted); font-size: 14px; }
.react {
  margin-left: auto; font-family: var(--font-display); color: var(--gold); font-size: 18px;
  opacity: 0; transform: translateY(6px) rotate(-4deg); transition: opacity .18s ease, transform .18s ease;
  white-space: nowrap;
}
.react.on { opacity: 1; transform: translateY(0) rotate(-4deg); }
.qtitle { font-size: clamp(25px, 6.6vw, 34px); }
.tapes { display: flex; flex-direction: column; gap: 12px; }
.tape {
  appearance: none; width: 100%; cursor: pointer; text-align: left;
  font: inherit; font-size: 17px; line-height: 1.35; color: var(--fg);
  background: var(--tape); border: 0; border-radius: 12px;
  padding: 16px 16px 16px 14px;
  display: flex; gap: 14px; align-items: center; position: relative;
  box-shadow: 0 3px 0 #0b0f08, inset 0 0 0 1px rgba(255,255,255,.03);
  transition: transform .14s ease, background .14s ease;
}
.tape::before { content: ""; position: absolute; inset: 5px; border: 1.5px dashed var(--thread); border-radius: 8px; pointer-events: none; transition: border-color .14s ease; }
.tape:hover { background: var(--tape-hi); transform: translateY(-2px); }
.tape:hover::before { border-color: var(--gold-deep); }
.tape .k {
  flex: 0 0 auto; width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center;
  font-family: var(--font-display); font-size: 15px; color: #1c1505; background: var(--gold);
  box-shadow: 0 2px 0 var(--gold-deep);
}
.tape.picked { background: #34401f; transform: scale(.985); }
.tape.picked::before { border-color: var(--gold); }
.tape.dim { opacity: .45; }
.qfoot { display: flex; justify-content: space-between; align-items: center; gap: 12px; color: var(--muted); font-size: 13px; }
.link-btn { appearance: none; background: none; border: 0; padding: 6px 0; color: var(--muted); font: inherit; font-size: 15px; cursor: pointer; }
.link-btn:hover { color: var(--fg); }

/* штаб розглядає */
.hq { min-height: 340px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; }
.hq svg { width: 96px; height: 96px; animation: spin 1.6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.hq h2 { font-size: 24px; }
.hq ul { list-style: none; margin: 0; padding: 0; font-family: var(--font-type); font-size: 14px; color: var(--muted); display: flex; flex-direction: column; gap: 6px; min-height: 66px; }
.hq li b { color: var(--gold); font-weight: 400; }

/* особова справа */
.dossier {
  position: relative; color: var(--paper-ink); font-family: var(--font-type);
  background:
    radial-gradient(circle at 18% 22%, rgba(255,255,255,.22), transparent 40%),
    radial-gradient(circle at 85% 80%, rgba(120,90,40,.18), transparent 45%),
    var(--paper);
  border-radius: 6px 18px 18px 18px;
  padding: 26px clamp(18px, 5vw, 30px) 96px;
  box-shadow: 0 18px 40px rgba(0,0,0,.5), inset 0 0 0 1px rgba(80,60,20,.25);
  display: flex; flex-direction: column; gap: 18px;
  animation: slideup .5s cubic-bezier(.2,.9,.3,1.1) both;
}
.dossier::before {
  content: "ОСОБОВА СПРАВА"; position: absolute; top: -26px; left: 0;
  background: var(--paper); color: var(--paper-ink); font-size: 11px; letter-spacing: .14em;
  padding: 7px 16px 5px; border-radius: 8px 8px 0 0;
}
@keyframes slideup { from { transform: translateY(30px); opacity: .001; } to { transform: none; opacity: 1; } }
.dos-top { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; border-bottom: 2px solid var(--paper-ink); padding-bottom: 8px; }
.dos-top { align-items: center; }
.dos-org { display: inline-flex; align-items: center; gap: 8px; }
.dos-org img { width: 20px; height: auto; }
.dos-main { display: grid; grid-template-columns: 170px 1fr; gap: 20px; align-items: center; }
.patch-big { width: 100%; transform: rotate(-5deg); filter: drop-shadow(0 6px 6px rgba(60,40,10,.4)); animation: sewin .7s cubic-bezier(.2,1.4,.4,1) .25s both; }
.patch-big svg { width: 100%; height: auto; display: block; }
@keyframes sewin { from { transform: rotate(-30deg) scale(.4); opacity: .001; } to { transform: rotate(-5deg) scale(1); opacity: 1; } }
.fields { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.field { display: flex; flex-direction: column; gap: 1px; border-bottom: 1.5px dotted var(--paper-line); padding-bottom: 6px; }
.field small { font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: #6f5d3a; }
.field strong { font-family: var(--font-display); font-weight: 400; font-size: clamp(22px, 5.6vw, 28px); line-height: 1.05; color: #1f190f; }
.field span { font-size: 15px; }
.rar { display: inline-block; background: var(--paper-ink); color: var(--paper); padding: 2px 8px; border-radius: 4px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }
.char { font-size: 16px; line-height: 1.55; }
.char b { font-weight: 400; text-transform: uppercase; letter-spacing: .1em; font-size: 11px; color: #6f5d3a; display: block; margin-bottom: 4px; }
.skills { display: flex; flex-direction: column; gap: 8px; }
.skill { display: grid; grid-template-columns: 128px 1fr 48px; gap: 10px; align-items: center; font-size: 14px; }
.segs { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; }
.segs i { height: 12px; border-radius: 2px; background: rgba(42,34,22,.15); }
.segs i.f { background: var(--paper-ink); animation: segin .25s ease both; }
@keyframes segin { from { transform: scaleY(.2); } to { transform: none; } }
.skill em { font-style: normal; text-align: right; }
.stamp {
  position: absolute; right: 18px; bottom: 22px;
  font-family: var(--font-display); color: var(--red); font-size: 22px; letter-spacing: .04em;
  border: 4px double var(--red); border-radius: 8px; padding: 6px 12px 4px;
  transform: rotate(-13deg); opacity: .82; mix-blend-mode: multiply;
  animation: slam .45s cubic-bezier(.3,1.6,.5,1) .9s both;
  pointer-events: none;
}
@keyframes slam { from { transform: rotate(-13deg) scale(2.4); opacity: 0; } 60% { opacity: .9; } to { transform: rotate(-13deg) scale(1); opacity: .82; } }
.fact { background: var(--tape); border-radius: 14px; padding: 18px; display: flex; gap: 14px; align-items: flex-start; position: relative; }
.fact::before { content: ""; position: absolute; inset: 5px; border: 1.5px dashed var(--thread); border-radius: 10px; pointer-events: none; }
.fact .pin { flex: 0 0 auto; width: 38px; height: 38px; border-radius: 50%; background: var(--gold); display: grid; place-items: center; color: #1c1505; font-family: var(--font-display); font-size: 18px; }
.fact div { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.toast { font-size: 14px; color: var(--gold); min-height: 1.4em; text-align: center; margin-top: -8px; }

/* заклик */
.cta {
  position: relative; overflow: hidden;
  background: linear-gradient(140deg, #3c4826 0%, #273019 70%);
  border-radius: 20px; padding: clamp(22px, 6vw, 32px);
  display: flex; flex-direction: column; gap: 14px;
}
.cta::before { content: ""; position: absolute; inset: 6px; border: 1.5px dashed rgba(220,174,63,.35); border-radius: 15px; pointer-events: none; }
.cta h2 { font-size: clamp(26px, 7vw, 36px); }
.cta p { color: #dad9c5; max-width: 44ch; }
.phone { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.phone .num { font-family: var(--font-type); font-size: 20px; letter-spacing: .04em; user-select: all; }
.phone .btn { font-size: 13px; padding: 10px 14px; }
.cta small { color: #b9b9a2; font-size: 13px; }

/* моральна панель */
.panel {
  background-color: #262d1e;
  background-image: radial-gradient(rgba(0,0,0,.35) 1px, transparent 1.4px), radial-gradient(rgba(255,255,255,.05) 1px, transparent 1.4px);
  background-size: 6px 6px, 6px 6px; background-position: 0 0, 3px 3px;
  border-radius: 20px; padding: 22px clamp(14px, 4vw, 24px);
  box-shadow: inset 0 0 0 2px #1a2014, inset 0 0 30px rgba(0,0,0,.4);
  display: flex; flex-direction: column; gap: 16px;
}
.panel h3 { font-size: 20px; }
.panel .sub { color: var(--muted); font-size: 14px; }
.board { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px 8px; }
.mini { width: calc(25% - 6px); min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; font-size: 12px; line-height: 1.25; color: var(--muted); }
.mini svg { width: 100%; max-width: 92px; height: auto; display: block; filter: grayscale(1) brightness(.55) contrast(.9); transition: filter .3s ease; }
.mini.me svg { filter: drop-shadow(0 0 12px rgba(220,174,63,.55)); }
.mini.me { color: var(--gold); }
.mini.seen svg { filter: none; }
footer { font-size: 12px; color: var(--muted); text-align: center; display: flex; flex-direction: column; gap: 4px; }

.screen { animation: rise .32s ease both; }
@keyframes rise { from { opacity: .001; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001s !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; transition: none !important; }
}
@media (max-width: 480px) {
  .fan { height: 120px; }
  .fan .p { width: 84px; left: calc(var(--i) * (100% - 84px) / 6); }
  .dos-main { grid-template-columns: 1fr; justify-items: center; text-align: center; }
  .patch-big { width: 190px; }
  .fields { width: 100%; text-align: left; }
  .skill { grid-template-columns: 100px 1fr 42px; font-size: 13px; }
  .actions { grid-template-columns: 1fr; }
  .stamp { font-size: 19px; right: 16px; bottom: 22px; }
}
</style>

</head>
<body>
<div class="draft">Чернетка для погодження. Не офіційний ресурс НГУ.</div>
<div class="wrap">
  <div class="topbar"><span><b>НГУ</b> · Південне ОТО</span><span>міні-гра · 1 хв</span></div>
  <main id="app" aria-live="polite"></main>
  <footer>
    <p>Тест не збирає і не зберігає жодних даних. Без реєстрації.</p>
    <p>Котиків намальовано, збіги з реальними котами підрозділів випадкові.</p>
  </footer>
</div>

<script>
(function () {
  "use strict";

    }}
  ];
  var PAW = '<svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="16" rx="5.5" ry="4.6" fill="#dcae3f"/><circle cx="5.5" cy="10" r="2.4" fill="#dcae3f"/><circle cx="9.5" cy="6" r="2.4" fill="#dcae3f"/><circle cx="14.5" cy="6" r="2.4" fill="#dcae3f"/><circle cx="18.5" cy="10" r="2.4" fill="#dcae3f"/></svg>';

  function renderQ() {
    state.busy = false;
    var q = QUESTIONS[state.i], n = QUESTIONS.length, sc = SCENES[state.i];
    document.body.style.setProperty("--glow", sc.glow);
    var pips = ""; for (var p = 0; p < n; p++) pips += '<i class="' + (p < state.i ? "done" : p === state.i ? "now" : "") + '"></i>';
    app.innerHTML =
      '<div class="hud">' +
        '<div class="lvl"><b>Місія <span>' + (state.i + 1) + '</span> з ' + n + '</b><div class="pips">' + pips + '</div></div>' +
        '<div class="score">' + PAW + '<b id="pts">' + (state.i * 10) + '</b><small>мур-<br>очок</small><span class="plus" id="plus">+10</span></div>' +
      '</div>' +
      '<section class="mission">' +
        '<div class="scene"><svg viewBox="0 0 360 180" preserveAspectRatio="xMidYMid slice" aria-hidden="true">' + sc.svg() + '</svg>' +
          '<span class="badge">Місія ' + (state.i + 1) + ' · ' + sc.name + '</span><span class="combo" id="combo"></span></div>' +
        '<div class="mbody">' +
          '<h2 class="qtitle">' + esc(q.q) + '</h2>' +
          '<div class="tapes">' + q.a.map(function (a, j) {
            return '<button class="tape" type="button" data-j="' + j + '" id="t-' + state.i + '-' + j + '"><span class="k">' + KEYS[j] + '</span><span>' + esc(a[0]) + '</span></button>';
          }).join("") + '</div>' +
        '</div>' +
      '</section>' +
      '<div class="qfoot">' + (state.i > 0 ? '<button class="link-btn" id="back" type="button">← Попередня місія</button>' : '<span>Обирай те, що найближче</span>') + '<span>мяу</span></div>';
    Array.prototype.forEach.call(app.querySelectorAll(".tape"), function (b) {
      b.addEventListener("click", function () { pick(Number(b.getAttribute("data-j"))); });
    });
    var back = document.getElementById("back");
    if (back) back.addEventListener("click", function () { if (state.busy) return; state.i--; state.picks.length = state.i; renderQ(); });
  }

  function pick(j) {
    if (state.busy) return; state.busy = true;
    state.picks[state.i] = j;
    Array.prototype.forEach.call(app.querySelectorAll(".tape"), function (b) {
      b.classList.add(Number(b.getAttribute("data-j")) === j ? "picked" : "dim");
    });
    var combo = document.getElementById("combo");
    combo.textContent = REACTS[(state.i + j) % REACTS.length];
    combo.classList.add("on");
    document.getElementById("plus").classList.add("go");
    document.getElementById("pts").textContent = (state.i + 1) * 10;
    var pip = app.querySelector(".pips i.now"); if (pip) pip.className = "done";
    setTimeout(function () {
      if (state.i < QUESTIONS.length - 1) { state.i++; renderQ(); window.scrollTo(0, 0); }
      else renderHQ();
    }, reduce ? 150 : 760);
  }

  document.addEventListener("keydown", function (e) {
    if (!app.querySelector(".tape")) return;
    var m = { "1": 0, "2": 1, "3": 2, "4": 3 }[e.key];
    if (m !== undefined) pick(m);
  });

  function renderHQ() {
    var id = winnerOf(state.picks);
    var lines = [["Перевіряємо вусики", "ок"], ["Рахуємо мурчання", "ок"], ["Пришиваємо шеврон", "готово"]];
    app.innerHTML =
      '<section class="hq screen">' +
        '<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="40" fill="none" stroke="#2c3622" stroke-width="8"/><circle cx="50" cy="50" r="40" fill="none" stroke="#dcae3f" stroke-width="8" stroke-dasharray="2 2.6"/><path d="M50 10 a40 40 0 0 1 40 40" fill="none" stroke="#efebd9" stroke-width="8" stroke-linecap="round" opacity=".7"/></svg>' +
        '<span class="eyebrow">Місії виконано: 7 з 7 · 70 мур-очок</span><h2>Штаб розглядає справу</h2><ul id="hql"></ul>' +
      '</section>';
    window.scrollTo(0, 0);
    var ul = document.getElementById("hql"), step = reduce ? 60 : 420;
    lines.forEach(function (l, i) {
      setTimeout(function () { var li = document.createElement("li"); li.innerHTML = l[0] + "... <b>" + l[1] + "</b>"; ul.appendChild(li); }, step * (i + 1));
    });
    setTimeout(function () { renderResult(id); }, step * 4 + 150);
  }

  function renderResult(id) {
    document.body.style.setProperty("--glow", "rgba(220,174,63,.16)");
    var r = ROLES[id];
    var no = "КТ-" + (1000 + ORDER.indexOf(id) * 137 + state.picks.reduce(function (a, b, i) { return a + b * (i + 3); }, 0));
    var shareText = "Пройшов тест «Який ти котик НГУ»: я " + r.name + ", позивний «" + r.callsign + "». " + "Мій ідеальний напарник: " + ROLES[PARTNER[id]].name + " 🐾 Хто з вас ним буде?";
    var skills = r.skills.map(function (s, si) {
      var segs = ""; for (var i = 0; i < 10; i++) segs += '<i' + (i < s[1] ? ' class="f" style="animation-delay:' + (0.6 + si * 0.12 + i * 0.03).toFixed(2) + 's"' : "") + '></i>';
      return '<div class="skill"><span>' + s[0] + '</span><span class="segs" role="img" aria-label="' + s[0] + ': ' + s[1] + ' з 10">' + segs + '</span><em>' + s[1] + '/10</em></div>';
    }).join("");
    var board = ORDER.map(function (k) {
      return '<div class="mini' + (k === id ? " me" : "") + '">' + patch(k) + '<span>' + ROLES[k].name.replace("Котик-", "") + (k === id ? "<br>це ти" : "") + '</span></div>';
    }).join("");

    app.innerHTML =
      '<div style="height:18px"></div>' +
      '<article class="dossier">' +
        '<div class="dos-top"><span>Справа № ' + no + '</span><span class="dos-org"><img src="' + LOGO + '" alt="">Південне ОТО НГУ</span></div>' +
        '<div class="dos-main">' +
          '<div class="patch-big">' + patch(id) + '</div>' +
          '<div class="fields">' +
            '<div class="field"><small>Спеціальність</small><strong>' + r.name + '</strong></div>' +
            '<div class="field"><small>Позивний</small><span>«' + r.callsign + '»</span></div>' +
            '<div class="field"><small>Посада в НГУ</small><span>' + r.vos + '</span></div>' +
            '<div class="field"><small>Ідеальний напарник</small><span><span class="rar">' + ROLES[PARTNER[id]].name + '</span><br>' + WHY[id] + '</span></div>' +
          '</div>' +
        '</div>' +
        '<p class="char"><b>Характеристика</b>' + esc(r.desc) + '</p>' +
        '<div class="skills">' + skills + '</div>' +
        '<div class="stamp" aria-hidden="true">ЗАРАХОВАНО</div>' +
      '</article>' +
      '<div class="fact screen"><span class="pin" aria-hidden="true">!</span><div><span class="eyebrow">Це реально є в НГУ</span><p>' + esc(r.fact) + '</p></div></div>' +
      '<div class="actions"><button class="btn alt" id="copy" type="button">Скопіювати результат</button><button class="btn alt" id="again" type="button">Пройти ще раз</button></div>' +
      '<p class="toast" id="toast"></p>' +
      '<section class="cta screen">' +
        '<span class="eyebrow">Тепер без котячих жартів</span>' +
        '<h2>Хочеш у команду по-справжньому?</h2>' +
        '<p>Національна гвардія набирає за контрактом, зокрема на всі посади з цього тесту. Залиш анкету на офіційному сайті НГУ, обери свою область і посаду.</p>' +
        '<a class="btn" href="https://join.ngu.gov.ua/" target="_blank" rel="noopener">Анкета на join.ngu.gov.ua</a>' +
        '<div class="phone"><span class="num">063 236 02 22</span><button class="btn alt" id="copyPhone" type="button">Скопіювати номер</button></div>' +
        '<small>Південне відділення комплектування за контрактом, Одеса</small>' +
      '</section>' +
      '<section class="panel screen">' +
        '<h3>Моральна панель</h3>' +
        '<p class="sub">Твій шеврон уже на липучці. Решту відкриють побратими: скинь їм тест.</p>' +
        '<div class="board">' + board + '</div>' +
      '</section>';

    function toast(t) { var el = document.getElementById("toast"); if (el) el.textContent = t; }
    function copy(text, ok) {
      try { navigator.clipboard.writeText(text).then(function () { toast(ok); }, function () { toast(text); }); }
      catch (e) { toast(text); }
    }
    document.getElementById("copy").addEventListener("click", function () { copy(shareText, "Скопійовано. Встав у пост або сторіс"); });
    document.getElementById("copyPhone").addEventListener("click", function () { copy("063 236 02 22", "Номер скопійовано"); });
    document.getElementById("again").addEventListener("click", function () { state.i = 0; state.picks = []; renderStart(); window.scrollTo(0, 0); });
    window.scrollTo(0, 0);
  }

  renderStart();
})();
</script>

</body>
</html>
